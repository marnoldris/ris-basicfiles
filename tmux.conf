set -g mode-keys vi
set -g window-size largest
set -g mouse on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key S-Left swap-window -t -1
bind-key S-Right swap-window -t +1
set-option -g window-size smallest

# Enable clipboard copying from buffer
#set -s set-clipboard on
bind-key -T copy-mode Space send-keys -X begin-selection
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "wl-copy"
## Make sure it works with vi keys
bind-key -T copy-mode-vi Space send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

